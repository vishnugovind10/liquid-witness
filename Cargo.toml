[workspace]
members = [
    "crates/witness-core",
    "crates/witness-lwk",
    "crates/witness-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vishnu Govind"]
license = "MIT"
repository = "https://github.com/vishnugovind10/liquid-witness"
homepage = "https://github.com/vishnugovind10/liquid-witness"
readme = "README.md"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
witness-core = { path = "crates/witness-core" }
witness-lwk = { path = "crates/witness-lwk" }
